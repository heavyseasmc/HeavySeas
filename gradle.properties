org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

group=io.github.heavyseasmc
version=0.1.0-SNAPSHOT

# 两个模块共用的 Java 版本：工具链、字节码目标、fabric.mod.json 的 java 约束都从这里取。
# Minecraft 1.21.x 要求 21；引擎虽不依赖 MC，也对齐它，免得嵌进模组时字节码版本对不上。
java_version=21

# Minecraft / Fabric 坐标，只给 mod 模块用；fabric.mod.json 的版本约束也从这里展开。
# 这一组是一起实跑验收过的（编译 + 起服）；单独升其中一个，就不再是验收过的组合。
# ❗改 minecraft_version 时，engine 的 Gson 版本要对齐到新版 MC 自带的那一份（checkEngineLibraries 会拦）。
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.19.5
loom_version=1.17.20
fabric_api_version=0.116.17+1.21.1
