org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

group=io.github.heavyseasmc
version=0.1.0-SNAPSHOT

# 两个模块共用的 Java 版本：工具链、字节码目标、fabric.mod.json 的 java 约束都从这里取。
# Minecraft 1.21.x 要求 21；引擎虽不依赖 MC，也对齐它，免得嵌进模组时字节码版本对不上。
java_version=21

# Minecraft / Fabric 坐标，只给 mod 模块用；fabric.mod.json 的版本约束也从这里展开。
# 这一组是一起实跑验收过的（编译 + 起服 + 整局 + 客户端回归）；单独改其中一个，就不再是验收过的组合。
# ❗改 minecraft_version 时，engine 的 Gson 版本要对齐到新版 MC 自带的那一份（checkEngineLibraries 会拦）。
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
# loader 与 fabric-api 按**实测的最低版本**构建（用户 2026-09-25：「版本要求要降低，要核出最低标准」），
# fabric.mod.json 的「>=」就从这里展开 —— 按下限编译，谁用了只有新版才有的东西，编译当场就红。
# 为什么是这两个数（证据 HeavySeas-internal/evidence/2026-09-25-min-versions/）：
#  · loader 0.16.0：两个字体锁 mixin 用了 @WrapMethod，它在 MixinExtras 0.4.0 才有；loader 0.15.x 带的是 0.3.5。
#  · fabric-api 0.110.0：场景的展示实体 setter（setTransformation 等）靠它的传递访问放宽公开，0.110.0 才加上（0.109.0 没有）；
#    生产服务端实测：同一份 jar 配 0.109.0，开局放补给箱实物那一下 IllegalAccessError。❗开发环境里 0.108/0.109 照样编译得过（Loom 缓存），编译不是证据。
loader_version=0.16.0
loom_version=1.17.20
fabric_api_version=0.110.0+1.21.1
# Cardinal Components（决策 ⑫ 的承载层）。base + world 两个模块：
# ❗座位数据必须在 World 级组件 —— 决策 ⑧ 要求离线玩家的座位继续运转，
#   而 Player 级组件依附 ServerPlayerEntity，玩家离线时实例不存在，引擎取不到他的状态。
# 坐标出处 adr/0011 第 6 节（那里实测的是 base+entity；world 在本轮首次解析验证）。
cca_version=6.1.3

# 开发运行时用来验证近距离语音；生产包保持软依赖，服务器可选择不装。
voicechat_version=fabric-1.21.1-2.6.18
