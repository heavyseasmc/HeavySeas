// Fabric 模组（目标 Minecraft 1.21.1）。
//
// ❗依赖方向只能是 mod → engine。engine 那一侧由它自己的依赖白名单机械地拦；
//   这里要守的是另一半：玩家机器上，引擎的类由谁提供。

plugins {
    id 'fabric-loom'
}

base {
    archivesName = 'heavyseas'
}

loom {
    // 客户端专用的代码（HUD、渲染）只能写在 src/client：main 里引用客户端类，专用服务端上一加载就崩，
    // 而开发环境与单人游戏都测不出。拆开之后这件事在编译期就失败 —— 拆之前实测，main 能直接编译过那种引用。
    splitEnvironmentSourceSets()
}

// 批量生成工具（ADR-0053 §5 · ADR-0056）：救生艇方块的方块状态文件与带贴图的模型，按方块的属性展开。
// 生成物写进 src/main/generated 并入库（与卡面贴图一样：一份干净的克隆不跑生成器也能构建）；
// 生成器自己的代码在单独的 datagen 源码集里，不进发给玩家的 jar。重跑：./gradlew :mod:runDatagen
fabricApi {
    configureDataGeneration {
        createSourceSet = true
        // ❗顺序是实测出来的：splitEnvironmentSourceSets() 必须在这之前（之后再调，它要改的属性已经定死）；
        //   这一块又必须在 loom.mods 之前 —— Loom 按 modId 登记一份模组 heavyseas（带 datagen 源码集），
        //   写在后面就与 loom.mods 里那一份撞名（Cannot add a ModSettings with name 'heavyseas'）。
        //   不给 modId 也不行 —— Loom 要么要它、要么要 datagen 源码集里另有一份 fabric.mod.json（实测）。
        modId = 'heavyseas'
        strictValidation = false   // 大厅船那一块是手写的方块状态，不归生成器管
    }
}

loom {
    mods {
        heavyseas {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
            sourceSet sourceSets.datagen
        }
    }

    // 唯一的 mixin 在 client 源码集里（雾，ADR-0034 §5.1.1）。❗这一版 Loom 在 remapJar 时直接把 mixin 注解里的
    //   目标翻成中间名（实测：jar 里的 BackgroundRendererMixin 引用的是 class_758 / method_3211），**不生成 refmap**。
    //   第一版在 mixins.json 里写了 "refmap"，jar 里却没有那个文件 —— 开发客户端照样能注入，生产客户端只会多一行警告。
    //   所以 mixins.json 不写 refmap；下面的 checkMixinRemapped 守着「生产 jar 里的 mixin 真的翻过了」。
}

repositories {
    maven {
        name = 'Ladysnake'
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // Cardinal Components：对局状态的承载层（决策 ⑫）。JIJ 进本模组，玩家不必单独下载。
    // base 是框架，world 是「World 级组件」那一半 —— 座位数据只能放这一级，理由见 gradle.properties。
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:${cca_version}"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-world:${cca_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-base:${cca_version}"
    include "org.ladysnake.cardinal-components-api:cardinal-components-world:${cca_version}"

    // M5 只需要 Simple Voice Chat 自带的距离衰减，不注册会改变频道/窃听规则的 API 插件。
    // 只进开发运行时：生产 metadata 用 suggests 保持真正的软依赖。
    modRuntimeOnly "maven.modrinth:simple-voice-chat:${voicechat_version}"

    // 引擎不是 Fabric 模组，只是一个普通 jar：编译期直接依赖，打包时嵌进本模组的 jar。
    // ❗不嵌的话开发环境照样能跑（引擎就在类路径上），玩家那边却是 NoClassDefFoundError ——
    //   所以「runServer 起得来」证明不了这一行写对了，只有生产环境启动才证明得了。
    // 引擎的 Gson 不嵌：生产环境里用的是 Minecraft 自带的那一份，版本对齐见 engine/build.gradle。
    implementation project(':engine')
    include project(':engine')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// fabric.mod.json 里的版本约束全部从 gradle.properties 展开，JSON 里不另写一份。
// minecraft 展开成精确版本而不是 ~x.y.z：实测 Fabric 的 ~1.21.1 会放行 1.21.2 与 1.21.11。
def modMetadata = [
    version           : project.version.toString(),
    minecraft_version : minecraft_version,
    loader_version    : loader_version,
    fabric_api_version: fabric_api_version,
    java_version      : java_version,
    cca_version       : cca_version,
]

processResources {
    inputs.properties modMetadata
    filesMatching('fabric.mod.json') {
        expand modMetadata
    }

    // 数值数据以内置数据包的形式进 jar：仓库根的 data/ → jar 里的 data/heavyseas/。
    // ❗**不在模组资源里放第二份拷贝。** 引擎单测读的是仓库根那一份，模组读的是 jar 里那一份；
    //   两份各自维护必然漂移（证伪表里那两份 textguard 就是这么分岔的），所以这里只做搬运。
    // data/README.md 是权属声明，不是数值，不进 jar。
    from(rootProject.file('data')) {
        into 'data/heavyseas'
        include '**/*.json'
    }
}

// 上面那条 from 是「复制了几个文件」，复制 0 个与复制成功输出完全一样。
// 三份数值缺任何一份，模组在运行时才炸；这里让它在构建期就炸。
def checkBundledData = tasks.register('checkBundledData') {
    group = 'verification'
    description = '四份数值数据必须都进了 jar 的内置数据包'
    def expected = ['roster', 'provisions', 'navigation', 'weather'].collect { "data/heavyseas/${it}/default.json" }
    // ❗destinationDir 是 File 不是 Provider，用 flatMap 会在执行期炸「cannot be cast to Provider」。
    def resourceDir = tasks.named('processResources').map { it.destinationDir }
    inputs.files(tasks.named('processResources'))
    doLast {
        def root = resourceDir.get()
        def missing = expected.findAll { !new File(root, it).isFile() }
        if (missing) {
            throw new GradleException((['内置数据包缺文件（仓库根 data/ 没搬进来）：']
                    + missing.collect { '  - ' + it }).join(System.lineSeparator()))
        }
        logger.lifecycle("内置数据包核对通过：${expected.join('、')}")
    }
}

tasks.named('classes') {
    dependsOn checkBundledData
}

// 规则书网页版（ADR-0087 §2「网页版同源」）：与游戏里那本是同一份源文件、同一串块，
// 第三、十二、十三章的名字与数字一样从 data/ 与 lang 展开。不进 jar、不在门禁里，要看时跑一次。
tasks.register('rulebookHtml', JavaExec) {
    group = 'documentation'
    description = '规则书网页版 → build/rulebook/<语言>.html'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.heavyseasmc.mod.rulebook.RulebookHtml'
    def out = layout.buildDirectory.dir('rulebook')
    args out.get().asFile.path
    outputs.dir out
}

// 漏一个 lang 键的表现是界面上出现一行 `heavyseas.command.foo` 的原文 ——
// 游戏照跑，没有任何报错，也没有任何日志。正因为它安静，才必须在构建期拦。
//
// 判据只认**字面量**：代码里的 lang 键一律写成常量或 switch，不拼字符串
// （GameFlow 里那三个 switch 就是为这条改的）。唯一的例外是角色那一族 ——
// 角色 id 来自 data/roster，代码里没有那张表，所以单独按数据核对。
def checkLangKeys = tasks.register('checkLangKeys') {
    group = 'verification'
    description = '代码里用到的 lang 键必须在两份 lang 文件里都有，且两份键集相同'
    def sources = files(sourceSets.main.allJava, sourceSets.client.allJava)
    def langDir = file('src/main/resources/assets/heavyseas/lang')
    def rosterFile = rootProject.file('data/roster/default.json')
    def provisionFile = rootProject.file('data/provisions/default.json')
    inputs.files(sources, rosterFile, provisionFile)
    inputs.dir(langDir)
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def zh = slurper.parse(new File(langDir, 'zh_cn.json'), 'UTF-8') as Map
        def en = slurper.parse(new File(langDir, 'en_us.json'), 'UTF-8') as Map

        def problems = []
        def onlyZh = zh.keySet() - en.keySet()
        def onlyEn = en.keySet() - zh.keySet()
        onlyZh.each { problems << "只有 zh_cn 有：${it}" }
        onlyEn.each { problems << "只有 en_us 有：${it}" }

        // 两族键：界面文案 heavyseas.*，以及键位那一族 key.categories.heavyseas / key.heavyseas.*。
        // ❗第二族单独写一条，是因为它**不以 heavyseas 开头** —— 漏了它，
        //   键位设置里会直接显示 `key.heavyseas.hand` 这行原文，而游戏照跑、没有任何报错。
        def pattern = ~/"(heavyseas\.[A-Za-z0-9_.]+|key\.[A-Za-z0-9_.]*heavyseas[A-Za-z0-9_.]*)"/
        def used = [] as Set
        sources.each { f ->
            // 以 . 结尾的是拼接用的前缀（唯一一处：角色那一族），不是键本身。
            f.getText('UTF-8').findAll(pattern) { whole, key ->
                if (!key.endsWith('.')) {
                    used << key
                }
            }
        }
        if (used.isEmpty()) {
            // 正向对照：扫到 0 个与「全都有」输出一样。至少 /seas 的报错键该在。
            throw new GradleException('一个 lang 键都没扫到 —— 判据坏了，不是代码干净')
        }
        // 第二族也要各自有正向对照：只写一条 isEmpty，键位那一族整族扫不到时照样是绿的。
        if (!used.any { it.startsWith('key.') }) {
            throw new GradleException('键位那一族一个都没扫到 —— 正则的第二个分支坏了，不是真的没有键位')
        }
        (used - zh.keySet()).sort().each { problems << "代码用到但 lang 里没有：${it}" }

        // 角色那一族按数据核对：加一个角色而忘了加译名，同样是安静的。
        def roster = slurper.parse(rosterFile, 'UTF-8') as Map
        roster.characters.each { c ->
            // ❗.toString() 不能省：GString 与 String 的 hashCode 不同，
            //   containsKey 会对每一个键都返回 false —— 一道永远报错的闸门，和永远放行的一样坏。
            def key = "heavyseas.character.${c.id}".toString()
            if (!zh.containsKey(key)) {
                problems << "data/roster 有角色 ${c.id}，但 lang 里没有 ${key}"
            }
        }

        // 物资那一族同理：牌名与**提示签上那一句效果**都是拼出来的键，上面那一轮正则扫不到。
        // ❗加一张牌而忘了写那一句，屏幕上只会出现键名原文 —— 不报错，只是没人知道这张牌做什么。
        def provisions = slurper.parse(provisionFile, 'UTF-8') as Map
        provisions.cards.each { c ->
            ["heavyseas.provision.${c.id}".toString(),
             "heavyseas.provision.${c.id}.effect".toString()].each { key ->
                if (!zh.containsKey(key)) {
                    problems << "data/provisions 有 ${c.id}，但 lang 里没有 ${key}"
                }
            }
            def cat = "heavyseas.category.${c.category}".toString()
            if (!zh.containsKey(cat)) {
                problems << "data/provisions 里的类别 ${c.category} 在 lang 里没有 ${cat}"
            }
        }

        if (problems) {
            throw new GradleException((['lang 键核对失败：'] + problems.collect { '  - ' + it })
                    .join(System.lineSeparator()))
        }
        logger.lifecycle("lang 键核对通过：代码用到 ${used.size()} 个，两份 lang 各 ${zh.size()} 个，" +
                "角色 ${roster.characters.size()} 个都有译名，物资 ${provisions.cards.size()} 张都有牌名与效果句")
    }
}

tasks.named('check') {
    dependsOn checkLangKeys
}

// ADR-0093 B13 · B8：物品名与创造物品栏。两件事在游戏里都不报错 ——
//   ① 名字带括号或「 · 」（用户 2026-10-07「物品名后面不要带括号」：说明写进名字；分不开的写进 <键>.desc，名字下面那一行灰字）
//   ② 页表（CreativeTabs）漏了一件、写了两次、写了没登记的 id —— 物品栏里只是「找不到」
// 名字从两份 lang 读；登记的物品从各族源码的登记写法读，与页表不同源。起服时 CreativeTabs 还会照 Registries 再核一遍。
def checkItemCatalog = tasks.register('checkItemCatalog') {
    group = 'verification'
    description = '物品名不带括号与「 · 」· 每件登记的物品在创造物品栏里恰好出现一次（场景用的几件除外）'
    // 任务属性：红测要能把它们指向造坏的副本（docs/tools/build-redtests.sh）
    ext.langDir = file('src/main/resources/assets/heavyseas/lang')
    ext.tabsSource = file('src/main/java/io/github/heavyseasmc/mod/world/CreativeTabs.java')
    ext.mainSource = file('src/main/java')
    inputs.dir(ext.langDir)
    inputs.file(ext.tabsSource)
    inputs.dir(ext.mainSource)
    doLast { Task t ->
        def problems = []
        def slurper = new groovy.json.JsonSlurper()
        def names = 0
        ['zh_cn', 'en_us'].each { lang ->
            def m = slurper.parse(new File(t.ext.langDir, "${lang}.json"), 'UTF-8') as Map
            m.each { k, v ->
                if (k ==~ /(block|item|entity)\.heavyseas\.[a-z0-9_]+/) {
                    names++
                    if (v =~ /[()（）\[\]【】]/ || v.contains(' · ')) {
                        problems << "${lang}：${k} =「${v}」—— 名字里有括号或「 · 」（说明写进名字；分不开的写进 ${k}.desc）"
                    }
                }
            }
        }
        if (names < 200) {
            throw new GradleException("只认出 ${names} 条物品名 —— 判据坏了，不是名字干净")
        }

        // 页表：「页表开始」与「页表结束」之间的每个字符串字面量（页 id 是 p<数字>_…）
        def tabs = t.ext.tabsSource.getText('UTF-8')
        int a = tabs.indexOf('// ---- 页表开始'), b = tabs.indexOf('// ---- 页表结束')
        if (a < 0 || b < a) {
            throw new GradleException("${t.ext.tabsSource.name} 里找不到「页表开始 / 页表结束」—— 判据坏了")
        }
        def pages = [:]
        def listed = []
        String page = null
        tabs.substring(a, b).findAll(/"([a-z0-9_]+)"/) { whole, id ->
            if (id ==~ /p\d_[a-z_]+/) {
                page = id
                pages[page] = 0
            } else {
                listed << id
                pages[page] = pages[page] + 1
            }
        }
        def exempt = [] as Set
        def ex = tabs =~ /NOT_IN_TABS = Set\.of\(([^;]*)\);/
        if (ex.find()) {
            ex.group(1).findAll(/"([a-z0-9_]+)"/) { whole, id -> exempt << id }
        }

        // 登记的物品：各族的登记写法（与 checkLinerBlocks 同一套）· 直接按 id 登记物品的 · 场景物品
        def registered = [] as Set
        def files = project.fileTree(t.ext.mainSource).matching { include '**/*.java' }.files
        files.each { File f ->
            def text = f.getText('UTF-8')
            if (f.name ==~ /(Liner(Blocks|Props|Glass|Hull|Doors|Stairs)|SkiffBlocks)\.java/) {
                text.findAll(/(?:add|frame|prop|glass|hull|door|window)\("((?:liner|skiff)_[a-z0-9_]+)"/) { whole, id -> registered << id }
            }
            text.findAll(/Registries\.ITEM, Identifier\.of\(HeavySeasMod\.MOD_ID, "([a-z0-9_]+)"\)/) { whole, id -> registered << id }
            if (f.name == 'SceneItems.java') {
                text.findAll(/register\("([a-z0-9_]+)"/) { whole, id -> registered << id }
            }
        }
        // 正向对照：每一种登记写法都得认出东西来，否则「没登记」与「没在扫」一样
        ['liner_wall', 'liner_sofa_cream', 'liner_window_2x2', 'liner_door_cabin', 'liner_balustrade', 'skiff_hull',
         'gull_spawn_egg', 'chart_ship'].each {
            if (!registered.contains(it)) {
                throw new GradleException("登记的物品里没认出 ${it}（共认出 ${registered.size()} 件）—— 判据坏了")
            }
        }

        def seen = [] as Set
        listed.each { id ->
            if (!seen.add(id)) {
                problems << "${id} 在物品栏里出现了两次"
            }
            if (!registered.contains(id)) {
                problems << "物品栏里的 ${id} 没有登记"
            }
        }
        (registered - seen - exempt).sort().each { problems << "${it} 没进物品栏的任何一页（场景用的写进 NOT_IN_TABS）" }
        (exempt - registered).sort().each { problems << "NOT_IN_TABS 里的 ${it} 没有登记" }

        if (problems) {
            throw new GradleException((['物品目录核对失败：'] + problems.collect { '  - ' + it }).join(System.lineSeparator()))
        }
        t.logger.lifecycle("物品目录核对通过：两份 lang 共 ${names} 条名字不带括号 · 登记 ${registered.size()} 件 = " +
                "物品栏 ${listed.size()} 件（${pages.collect { k, v -> "$k $v" }.join(' · ')}）+ 不进物品栏 ${exempt.size()} 件（场景用 · 骑缝吸顶灯）")
    }
}

tasks.named('check') {
    dependsOn checkItemCatalog
}

// 通知侧栏有两条容易“看起来代码都在、实机却完全看不见”的约束：
//   ① HudRenderCallback 比 Screen 先画，GameScreen 打开的那一帧必须改由 afterRender 画；
//   ② GameScreen 的 width 必须在绘制和输入前收窄，否则牌与按钮仍会钻进侧栏下面。
// 这两条是 Fabric/Minecraft 回调接线，普通 JVM 单测触不到；几何由 NotificationSidebarLayoutTest 测，
// 这里把接线本身做成源码闸门，防止以后“整理回调”时安静地退回错误层级。
def checkNotificationSidebarIntegration = tasks.register('checkNotificationSidebarIntegration') {
    group = 'verification'
    description = 'GameScreen 必须先为通知侧栏留宽度，并在 Screen 完成后才绘制侧栏'
    def entryFile = file('src/client/java/io/github/heavyseasmc/mod/client/HeavySeasClient.java')
    def hookFile = file('src/client/java/io/github/heavyseasmc/mod/client/GameScreenSidebar.java')
    def hudFile = file('src/client/java/io/github/heavyseasmc/mod/client/GameHud.java')
    def screenFile = file('src/client/java/io/github/heavyseasmc/mod/client/GameScreen.java')
    def gameScreenSources = fileTree('src/client/java/io/github/heavyseasmc/mod/client') {
        include '*Screen.java'
    }
    inputs.files(entryFile, hookFile, hudFile, screenFile, gameScreenSources)
    doLast {
        def entry = entryFile.getText('UTF-8')
        def hook = hookFile.getText('UTF-8')
        def hud = hudFile.getText('UTF-8')
        def screen = screenFile.getText('UTF-8')
        def problems = []

        if (!entry.contains('GameScreenSidebar.register();')) {
            problems << '客户端入口没有注册 GameScreenSidebar'
        }
        if (!hook.contains('ScreenEvents.beforeRender(screen).register')) {
            problems << 'GameScreen 绘制前没有刷新内容区宽度'
        }
        if (!hook.contains('gameScreen.reserveNotificationSidebar(context.getScaledWindowWidth())')) {
            problems << 'beforeRender 没有按完整窗口宽度预留侧栏（可能会逐帧越减越窄）'
        }
        if (!hook.contains('ScreenEvents.afterRender(screen).register')
                || !hook.contains('GameHud.renderSidebar(context, client)')) {
            problems << '通知侧栏不是在 GameScreen 完成后绘制'
        }
        def skipsHudLayer = java.util.regex.Pattern.compile(
                'if \\(client\\.currentScreen instanceof GameScreen\\) \\{\\s*return;\\s*\\}',
                java.util.regex.Pattern.DOTALL).matcher(hud).find()
        if (!skipsHudLayer) {
            problems << '普通 HudRenderCallback 没有跳过 GameScreen，会在错误层级重复绘制'
        }
        if (!screen.contains('width = GameHud.sidebarLayout(screenWidth, projection()).contentWidth();')) {
            problems << 'GameScreen 没有把所有子类共用的 width 收进侧栏左边'
        }
        if (!screen.contains('reserveNotificationSidebar(client == null ? width : client.getWindow().getScaledWidth());')) {
            problems << 'GameScreen.init 没有在子类创建控件前预留侧栏'
        }
        // 「整窗压暗」自 ADR-0037 起归 GuiMaterial.dimWorld：铺底要调它，而它铺的必须是整个窗口 ——
        // 材质板只铺在收窄后的舞台上，侧栏那一侧靠的就是这一层，少了它侧栏下半截会露出比左边亮的世界。
        def material = file('src/client/java/io/github/heavyseasmc/mod/client/GuiMaterial.java').getText('UTF-8')
        // 2026-09-30 起那一层是样张的 .dimmer（ADR-0047）：按帧缓冲的全宽全高画，照样是整个窗口。
        if (!screen.contains('GuiMaterial.dimWorld(context);')
                || !material.contains('hudPart(context, HudPart.DIMMER, 0, 0, window.getFramebufferWidth(), window.getFramebufferHeight(),')) {
            problems << 'GameScreen 主内容收窄后，公共底色没有继续覆盖完整窗口'
        }

        int subclasses = 0
        int initOverrides = 0
        gameScreenSources.each { source ->
            def text = source.getText('UTF-8')
            if (!text.contains('extends GameScreen')) {
                return
            }
            subclasses++
            if (text.contains('protected void init()')) {
                initOverrides++
                def superFirst = java.util.regex.Pattern.compile(
                        'protected void init\\(\\) \\{\\s*super\\.init\\(\\);',
                        java.util.regex.Pattern.DOTALL).matcher(text).find()
                if (!superFirst) {
                    problems << "${source.name} 的 init 没有先调用 super.init()，控件可能按完整宽度缓存"
                }
            }
        }
        if (subclasses == 0 || initOverrides == 0) {
            problems << "GameScreen 子类扫描没有命中（子类 ${subclasses}，init 覆写 ${initOverrides}）"
        }

        if (problems) {
            throw new GradleException((['通知侧栏接线核对失败：']
                    + problems.collect { '  - ' + it }).join(System.lineSeparator()))
        }
        logger.lifecycle("通知侧栏接线核对通过：${subclasses} 个 GameScreen 子类（${initOverrides} 个覆写 init）" +
                '先预留内容区，afterRender 绘制侧栏，HUD 层不重复画')
    }
}

tasks.named('check') {
    dependsOn checkNotificationSidebarIntegration
}

// 物资的中文名必须与卡面 SVG 的 <title> 完全一致。
//
// 为什么单独一道闸：checkLangKeys 只认**字面量**键，而物资名在界面上是
// `"heavyseas.provision." + id` 拼出来的 —— 它整族都在那道闸的视野之外。
// 2026-09-15 实测：把 knife 的译名改成「小刀」、把 rum 从两份 lang 里一起删掉，
// checkLangKeys 照样打印「核对通过」。
//
// 为什么要紧：显示「小刀」而卡面印着「短刀」，**没有任何机器会报错**。
// 它和漏译不同 —— 漏译会露出键名，不一致则安安静静地一直错下去。
//
// 英文名只能查「有且非空」：卡面只印中文，没有可对照的权威英文。
def checkProvisionNames = tasks.register('checkProvisionNames') {
    group = 'verification'
    description = '物资的中文名必须与卡面 SVG 的 <title> 相同；英文名必须有且非空'
    def dataFile = rootProject.file('data/provisions/default.json')
    // 做成任务属性而不是局部变量：红测要能把它们指向造坏的副本，而不去改被跟踪的文件。
    ext.cardDir = rootProject.file('art/cards')
    ext.langDir = file('src/main/resources/assets/heavyseas/lang')
    inputs.file(dataFile)
    inputs.dir(ext.cardDir).optional()
    inputs.dir(ext.langDir).optional()
    doLast {
        File cardDir = ext.cardDir
        File langDir = ext.langDir
        def slurper = new groovy.json.JsonSlurper()
        def zh = slurper.parse(new File(langDir, 'zh_cn.json'), 'UTF-8') as Map
        def en = slurper.parse(new File(langDir, 'en_us.json'), 'UTF-8') as Map
        def ids = (slurper.parse(dataFile, 'UTF-8') as Map).cards.collect { it.id.toString() }
        if (ids.isEmpty()) {
            throw new GradleException('data/provisions 里一个 id 都没读到 —— 判据坏了，不是真的没有牌')
        }
        // 用单引号字符串而不是斜杠字面量：里头要写 </title>，斜杠会提前结束字面量。
        def title = java.util.regex.Pattern.compile('<title>([^<]*)</title>')

        def problems = []
        int compared = 0
        ids.each { id ->
            def key = "heavyseas.provision.${id}".toString()
            def svg = new File(cardDir, "provision.${id}.svg")
            if (!svg.isFile()) {
                problems << "data/provisions 有 ${id}，但卡面 ${svg.name} 不在"
                return
            }
            def m = title.matcher(svg.getText('UTF-8'))
            if (!m.find()) {
                problems << "${svg.name} 里没有 <title> —— 权威名字无从取"
                return
            }
            // <title> 形如「怒海狂涛 · 物资卡 · 短刀」，末段才是名字。
            def parts = m.group(1).split(' · ')
            def authoritative = parts[parts.length - 1].trim()
            compared++
            if (!zh.containsKey(key)) {
                problems << "${id}：zh_cn 里没有 ${key}（SVG 里的名字为「${authoritative}」）"
            } else if (zh[key] != authoritative) {
                problems << "${id}：zh_cn 为「${zh[key]}」，SVG 里为「${authoritative}」"
            }
            if (!en.containsKey(key)) {
                problems << "${id}：en_us 里没有 ${key}"
            } else if (!en[key].toString().trim()) {
                problems << "${id}：en_us 的 ${key} 是空的"
            }
        }
        // 正向对照：一张都没比到时，「全都对」与「没在比」输出一样。本仓库已实证七次假绿。
        if (compared == 0) {
            throw new GradleException('一张物资卡都没比对到 —— 判据坏了，不是名字都对')
        }
        if (problems) {
            throw new GradleException((['物资名与卡面核对失败：']
                    + problems.collect { '  - ' + it }).join(System.lineSeparator()))
        }
        logger.lifecycle("物资名核对通过：${compared} 张与卡面 <title> 完全一致，英文名 ${ids.size()} 个都在")
    }
}

tasks.named('check') {
    dependsOn checkProvisionNames
}

// 天候的 id 来自数据，中文名来自横版 SVG 卡面的 <title>；两边必须一一对应。
def checkWeatherNames = tasks.register('checkWeatherNames') {
    group = 'verification'
    description = '十张天候卡的数据 id、SVG 与中英文名称必须一一对应'
    def dataFile = rootProject.file('data/weather/default.json')
    // 做成任务属性：红测能换成造坏的副本，不改被跟踪的卡面与 lang。
    ext.cardDir = rootProject.file('art/cards')
    ext.langDir = file('src/main/resources/assets/heavyseas/lang')
    inputs.file(dataFile)
    inputs.dir(ext.cardDir).optional()
    inputs.dir(ext.langDir).optional()
    doLast {
        File cardDir = ext.cardDir
        File langDir = ext.langDir
        def slurper = new groovy.json.JsonSlurper()
        def ids = (slurper.parse(dataFile, 'UTF-8') as Map).cards.collect { it.id.toString() }
        def zh = slurper.parse(new File(langDir, 'zh_cn.json'), 'UTF-8') as Map
        def en = slurper.parse(new File(langDir, 'en_us.json'), 'UTF-8') as Map
        def title = java.util.regex.Pattern.compile('<title>([^<]*)</title>')
        def problems = []
        ids.each { id ->
            def svg = new File(cardDir, "weather.${id}.svg")
            def key = "heavyseas.weather.${id}".toString()
            if (!svg.isFile()) {
                problems << "data/weather 有 ${id}，但卡面 ${svg.name} 不在"
                return
            }
            def match = title.matcher(svg.getText('UTF-8'))
            if (!match.find()) {
                problems << "${svg.name} 里没有 <title>"
                return
            }
            def parts = match.group(1).split(' · ')
            def authoritative = parts[parts.length - 1].trim()
            if (zh[key] != authoritative) {
                problems << "${id}：zh_cn 为「${zh[key]}」，SVG 里为「${authoritative}」"
            }
            if (!en.containsKey(key) || !en[key].toString().trim()) {
                problems << "${id}：en_us 缺少非空的 ${key}"
            }
        }
        (cardDir.listFiles({ f -> f.name.startsWith('weather.') && f.name.endsWith('.svg') } as FileFilter) ?: [])
                .each { svg ->
                    def id = svg.name.substring('weather.'.length(), svg.name.length() - '.svg'.length())
                    if (!ids.contains(id)) {
                        problems << "${svg.name} 有卡面，但 data/weather 没有 ${id}"
                    }
                }
        if (ids.size() != 10) {
            problems << "天候应有 10 张，数据里是 ${ids.size()} 张"
        }
        if (problems) {
            throw new GradleException((['天候名与卡面核对失败：']
                    + problems.collect { '  - ' + it }).join(System.lineSeparator()))
        }
        logger.lifecycle("天候名核对通过：${ids.size()} 张数据、SVG 与中英文名一一对应")
    }
}

tasks.named('check') {
    dependsOn checkWeatherNames
}

// 航海牌的 31 张卡面必须与 data/navigation 一一对应（adr/0020）。
//
// 为什么要一道闸：卡面由内部管线生成、产物入库，而**数据在这边**。数据加一张牌、改一个 id，
// 卡面不会自己跟着变；表现是那一张在 GUI 里画不出来（或画出另一张），而构建、单测、起服全是绿的。
//
// 判据取自与卡面正交的来源：id 来自 data，卡面只被问「你自称是谁」（`<title>` 末段）。
// 英文名那种「有且非空」的软判据在这里不适用 —— 这一族根本没有名字，只有 id。
def checkNavigationCards = tasks.register('checkNavigationCards') {
    group = 'verification'
    description = '每张航海牌都要有对应的卡面 SVG，且 SVG 自称的 id 与数据一致；不许多出没有数据的卡面'
    def dataFile = rootProject.file('data/navigation/default.json')
    // 做成任务属性而不是局部变量：红测要能把它指向造坏的副本，而不去改被跟踪的卡面。
    ext.cardDir = rootProject.file('art/cards')
    inputs.file(dataFile)
    inputs.dir(ext.cardDir).optional()
    doLast {
        File cardDir = ext.cardDir
        def ids = (new groovy.json.JsonSlurper().parse(dataFile, 'UTF-8') as Map)
                .cards.collect { it.id.toString() }
        if (ids.isEmpty()) {
            throw new GradleException('data/navigation 里一个 id 都没读到 —— 判据坏了，不是真的没有牌')
        }
        // 用单引号字符串而不是斜杠字面量：里头要写 </title>，斜杠会提前结束字面量。
        def title = java.util.regex.Pattern.compile('<title>([^<]*)</title>')
        def problems = []
        int compared = 0
        ids.each { id ->
            def svg = new File(cardDir, "nav.${id}.svg")
            if (!svg.isFile()) {
                problems << "data/navigation 有 ${id}，但卡面 ${svg.name} 不在"
                return
            }
            def m = title.matcher(svg.getText('UTF-8'))
            if (!m.find()) {
                problems << "${svg.name} 里没有 <title> —— 它自称是谁无从问起"
                return
            }
            // <title> 形如「怒海狂涛 · 航海卡 · nav_07」，末段才是 id。
            def parts = m.group(1).split(' · ')
            def claimed = parts[parts.length - 1].trim()
            compared++
            if (claimed != id) {
                problems << "${svg.name} 自称 ${claimed}，但它该是 ${id}"
            }
        }
        // 多出来的卡面同样要拦：删一张数据而卡面留着，GUI 会画出一张规则里不存在的牌。
        def known = ids.collect { "nav.${it}.svg".toString() } as Set
        (cardDir.listFiles({ f -> f.name.startsWith('nav.') && f.name.endsWith('.svg') } as FileFilter) ?: [])
                .each { f ->
            if (!known.contains(f.name)) {
                problems << "${f.name} 在 art/cards 里，但 data/navigation 里没有这张牌"
            }
        }
        // 正向对照：一张都没比到时，「全都对」与「没在比」输出一样。本仓库已实证八次假绿。
        if (compared == 0) {
            throw new GradleException('一张航海卡都没比对到 —— 判据坏了，不是 id 都对')
        }
        if (problems) {
            throw new GradleException((['航海卡面与数据核对失败：']
                    + problems.collect { '  - ' + it }).join(System.lineSeparator()))
        }
        logger.lifecycle("航海卡面核对通过：${compared} 张与 data/navigation 的 id 一一对应")
    }
}

tasks.named('check') {
    dependsOn checkNavigationCards
}

// Minecraft 不认 SVG —— GUI 里能画的只有 PNG。牌面的分层素材由内部管线烘出来并**入库**（ADR-0039）：
// 边框（每牌型每档一张）· 插画（每张牌一张，透明底）· 卡牌图标 · 牌背三档。生成物入库是有意的，
// 否则一份干净的克隆构建不出能用的 jar。
//
// 这道闸门查的都是安静的失败：
//   ① 数据里有这张牌、插画却没烘 —— 运行时画一块占位并记一行日志，但构建照样绿；
//   ② 贴图烘成了 0 字节或不是 PNG —— 无头浏览器那一步失败时正是这样，而它 exit 0；
//   ③ 贴图小于应有尺寸 —— 缩到小牌时字与线条糊掉（2026-09-15 真实客户端上看到的）；
//   ④ 比例不对 —— 版面按比例排，不对就被拉伸，拉伸同样不报错；
//   ⑤ 插画不是透明底 —— 那就等于又烘了一整张牌，边框被它盖住，而屏幕上「看起来还行」。
// 应有尺寸取自版面描述（layout.json 的 texture），不在这里另写一份 —— 期望值与被测对象同源证明不了任何事，
// 而与「烘出来的那一份」正交的来源正是版面描述（证伪表：尺寸检查的期望值与渲染同源那一次）。
def checkCardTextures = tasks.register('checkCardTextures') {
    group = 'verification'
    description = '牌面的分层素材：每张牌的插画（透明底）· 每牌型每档的边框 · 秘密牌背三档 · 代码用到的卡牌图标，都在且尺寸、比例对'
    def dataFile = rootProject.file('data/provisions/default.json')
    def rosterFile = rootProject.file('data/roster/default.json')
    def weatherFile = rootProject.file('data/weather/default.json')
    def navFile = rootProject.file('data/navigation/default.json')
    def layoutFile = file('src/main/resources/assets/heavyseas/cards/layout.json')
    // 图标清单取自**用它的那一侧**（拼牌的代码），不是烘它的管线：管线漏烘一枚，这里才看得见。
    def facesSrc = file('src/main/java/io/github/heavyseasmc/mod/card/CardFaces.java')
    def painterSrc = file('src/client/java/io/github/heavyseasmc/mod/client/CardPainter.java')
    // 行动 · 表态 · 站队（ADR-0050）不在 data 里：id 取自用它的那一侧（枚举常量名小写），理由同图标。
    def actionSrc = file('src/main/java/io/github/heavyseasmc/mod/card/ActionCard.java')
    // 做成任务属性而不是局部变量：红测要能把它指向一份造坏的目录树，而不去改被跟踪的贴图。
    ext.cardsDir = file('src/main/resources/assets/heavyseas/textures/gui/cards')
    inputs.files(dataFile, rosterFile, weatherFile, navFile, layoutFile, facesSrc, painterSrc, actionSrc)
    inputs.dir(ext.cardsDir).optional()
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def ids = { File f, String key -> (slurper.parse(f, 'UTF-8') as Map)[key].collect { it.id.toString() } }
        def cards = [
                provision: ids(dataFile, 'cards'),
                character: ids(rosterFile, 'characters'),
                weather  : ids(weatherFile, 'cards'),
                nav      : ids(navFile, 'cards'),
                // ❗不锚行首：枚举常量一行写好几个（ROW(…), SWAP(…), STEAL(…)），第一版按 ^ 取只认出每行第一个 ——
                //   十张里查了三张，照样打印「核对通过」（2026-10-01 红测删 steal.png 时才照出来）
                action   : (actionSrc.getText('UTF-8') =~ /\b([A-Z]+)\(Group\.[A-Z]+\)/).collect { it[1].toLowerCase() },
        ]
        cards.each { kind, list ->
            if (list.isEmpty()) {
                throw new GradleException("data 里一张 ${kind} 都没读到 —— 判据坏了，不是真的没有牌")
            }
        }
        def layout = slurper.parse(layoutFile, 'UTF-8') as Map
        def tiers = layout.tiers.collect { it.toString() }
        def texOf = { String kind -> layout.shapes[layout.kinds[kind].shape].texture.collect { it as int } }
        def icons = [] as TreeSet
        (facesSrc.getText('UTF-8') =~ /public static final String \w+ = "(\w+)";/).each { icons << it[1] }
        (painterSrc.getText('UTF-8') =~ /icon\("(\w+)"\)/).each { icons << it[1] }
        if (icons.size() < 8) {
            throw new GradleException("代码里只认出 ${icons.size()} 枚卡牌图标 —— 判据的正则坏了，不是图标都在")
        }

        File root = ext.cardsDir
        def problems = []
        def sizes = [] as TreeSet
        int checked = 0
        long bytes = 0
        def checkOne = { String rel, int wantW, int wantH, boolean transparent ->
            def f = new File(root, rel)
            if (!f.isFile()) {
                problems << "缺贴图：${rel}"
                return
            }
            if (f.length() == 0) {
                problems << "${rel} 是 0 字节 —— 烘制那一步失败了"
                return
            }
            // PNG 头：前 4 字节是签名 89 50 4E 47；IHDR 里宽在第 16–19 字节、高在 20–23（大端）。
            def head = new byte[24]
            int got = f.withInputStream { it.read(head) }
            if (!(got >= 4 && head[0] == (byte) 0x89 && head[1] == (byte) 0x50
                    && head[2] == (byte) 0x4E && head[3] == (byte) 0x47)) {
                problems << "${rel} 不是 PNG（签名对不上）"
                return
            }
            def be = { int at ->
                ((head[at] & 0xff) << 24) | ((head[at + 1] & 0xff) << 16) | ((head[at + 2] & 0xff) << 8) | (head[at + 3] & 0xff)
            }
            int w = be(16)
            int h = be(20)
            checked++
            if (w < wantW || h < wantH) {
                problems << "${rel} 只有 ${w}×${h}，低于 ${wantW}×${wantH} —— 烘制倍数不对，缩小时会糊"
                return
            }
            if ((long) w * wantH != (long) h * wantW) {
                problems << "${rel} 是 ${w}×${h}，不是 ${wantW}:${wantH} 的比例 —— 版面会把它拉伸"
                return
            }
            if (transparent) {
                def img = javax.imageio.ImageIO.read(f)
                if (img == null || ((img.getRGB(2, 2) >>> 24) & 0xff) != 0) {
                    problems << "${rel} 左上角不透明 —— 插画层带了纸或框，会把边框盖住"
                    return
                }
            }
            sizes << "${w}×${h}".toString()
            bytes += f.length()
        }
        cards.each { kind, list ->
            def (tw, th) = texOf(kind)
            list.each { checkOne("art/${kind}/${it}.png", tw, th, true) }
            tiers.each { checkOne("frame/${kind}/${it}.png", tw, th, false) }
        }
        // 牌背：终局翻牌的暗牌只用 secret（爱恨卡的背面），三档各一张。另两张没有界面在用，不拦。
        def (bw, bh) = texOf('provision')
        tiers.eachWithIndex { t, i -> checkOne(i == 0 ? 'back/secret.png' : "back/lod${i}/secret.png", bw, bh, false) }
        // 图标按贴图自己的宽高比画（ADR-0090：海鸥是扁的、秤砣与箭头是瘦的），所以只查短边够不够；
        // 圆盘、圆圈与斜线是按正方形画的（CardPainter 里给 d×d），这几枚还得是方的。
        def squareOnly = ['chip_disc', 'chip_ring', 'strike'] as Set
        icons.each {
            if (it in squareOnly) {
                checkOne("icon/${it}.png", 64, 64, false)
            } else {
                def f = new File(root, "icon/${it}.png")
                if (!f.isFile()) {
                    problems << "缺贴图：icon/${it}.png"
                    return
                }
                def img = javax.imageio.ImageIO.read(f)
                checked++
                if (img == null) {
                    problems << "icon/${it}.png 读不出来"
                } else if (Math.min(img.width, img.height) < 64) {
                    problems << "icon/${it}.png 只有 ${img.width}×${img.height}，短边低于 64 —— 缩小时会糊"
                } else {
                    sizes << "${img.width}×${img.height}".toString()
                    bytes += f.length()
                }
            }
        }
        // 正向对照：一张都没查到时，「全都对」与「没在查」输出一样。
        if (checked == 0 && problems.isEmpty()) {
            throw new GradleException('一张贴图都没查到 —— 判据坏了，不是都对')
        }
        if (problems) {
            throw new GradleException((['GUI 卡面贴图核对失败：']
                    + problems.collect { '  - ' + it }).join(System.lineSeparator()))
        }
        logger.lifecycle("GUI 贴图核对通过：插画 物资 ${cards.provision.size()} · 角色 ${cards.character.size()} · 天候 ${cards.weather.size()} · 航海 ${cards.nav.size()} · 行动 ${cards.action.size()}（透明底）· 边框 ${cards.size()} 种 × ${tiers.size()} 档 · 牌背 ${tiers.size()} 档 · 图标 ${icons.size()} 枚，尺寸 ${sizes.join('、')}，合计 ${(bytes / 1024) as int} KB")
    }
}

tasks.named('check') {
    dependsOn checkCardTextures
}

// 场景资源（ADR-0034 §5.2.3 · §8.2）：模型与贴图写错了，游戏照跑、没有报错 ——
// 越界的元素被裁掉、缺的贴图是一块紫黑格子、非 16 倍数的贴图在低档位上糊掉，都只有进了世界才看得见。
// 判据都读文件本身（JSON 坐标 · PNG 头 · 布局里的 item id），不问加载器怎么说。
def checkSceneAssets = tasks.register('checkSceneAssets') {
    group = 'verification'
    description = '场景模型元素在 [-16, 32]、引用的贴图存在且是 16 的倍数的 PNG、布局里每个 item 有模型、音频都在 NOTICE 里登记'
    // 任务属性而不是局部变量：红测要能把它们指向造坏的副本，而不去改被跟踪的资源。
    ext.assetsDir = file('src/main/resources/assets/heavyseas')
    ext.layoutFile = file('src/main/resources/data/heavyseas/voyage/default.json')
    ext.noticeFile = rootProject.file('NOTICE')
    inputs.dir(ext.assetsDir).optional()
    inputs.file(ext.layoutFile).optional()
    inputs.file(ext.noticeFile).optional()
    doLast {
        def slurper = new groovy.json.JsonSlurper()
        def problems = []
        def rel = { File f -> ext.assetsDir.toPath().relativize(f.toPath()).toString().replace('\\', '/') }
        // PNG 头：8 字节签名 + IHDR 里的宽高（大端）。不经 ImageIO：无头环境下它的行为随平台变。
        def pngSize = { File f ->
            def head = new byte[24]
            f.withInputStream { it.read(head) }
            def sig = [0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A]
            if ((0..7).any { (head[it] & 0xFF) != sig[it] }) { return null }
            def be = { int o -> ((head[o] & 0xFF) << 24) | ((head[o + 1] & 0xFF) << 16) | ((head[o + 2] & 0xFF) << 8) | (head[o + 3] & 0xFF) }
            return [be(16), be(20)]
        }
        def modelFiles = []
        ['item', 'block'].each { kind ->
            def dir = new File(ext.assetsDir, "models/${kind}")
            if (dir.isDirectory()) {
                dir.listFiles({ File f -> f.name.endsWith('.json') } as FileFilter).sort { it.name }.each { modelFiles << it }
            }
        }
        // 正向对照：一个模型都没扫到，「0 处问题」与「没在查」输出完全相同。
        if (modelFiles.isEmpty()) {
            throw new GradleException("没在查：${ext.assetsDir} 下 models/item 与 models/block 里一个模型 JSON 都没读到 —— 判据坏了，不是真的没有模型")
        }
        def checkedTextures = [] as Set
        modelFiles.each { File f ->
            def model = slurper.parse(f, 'UTF-8') as Map
            (model.elements ?: []).eachWithIndex { el, i ->
                ['from', 'to'].each { key ->
                    (el[key] ?: []).eachWithIndex { v, axis ->
                        if (v < -16 || v > 32) {
                            problems << "${rel(f)}：元素 ${i} 的 ${key}.${'xyz'[axis]} = ${v}，越界 [−16, 32]"
                        }
                    }
                }
            }
            (model.textures ?: [:]).each { name, ref ->
                def s = ref.toString()
                if (s.startsWith('#') || !s.startsWith('heavyseas:')) { return }   // 别的命名空间是 Minecraft 自带的，不归这里
                def png = new File(ext.assetsDir, "textures/${s.substring('heavyseas:'.length())}.png")
                if (!checkedTextures.add(png.path)) { return }
                if (!png.isFile()) {
                    problems << "${rel(f)}：贴图 ${s} 不存在（要 ${rel(png)}）"
                    return
                }
                def size = pngSize(png)
                if (size == null) {
                    problems << "${rel(png)}：不是 PNG（签名对不上）"
                } else if (size[0] % 16 != 0 || size[1] % 16 != 0) {
                    problems << "${rel(png)}：${size[0]}×${size[1]}，边长不是 16 的倍数"
                }
            }
        }
        // 布局里出现的每个 item id 都要有物品模型：缺了它，布景 / 箱子在世界里是一块紫黑格子。
        def layoutItems = [] as List
        def walk
        walk = { node ->
            if (node instanceof Map) {
                node.each { k, v -> if (k == 'item' && v instanceof CharSequence) { layoutItems << v.toString() } else { walk(v) } }
            } else if (node instanceof List) {
                node.each { walk(it) }
            }
        }
        if (ext.layoutFile.isFile()) { walk(slurper.parse(ext.layoutFile, 'UTF-8')) }
        layoutItems.each { id ->
            def name = id.contains(':') ? id.substring(id.indexOf(':') + 1) : id
            if (!new File(ext.assetsDir, "models/item/${name}.json").isFile()) {
                problems << "布局里的 item ${id}：没有 models/item/${name}.json"
            }
        }
        // 音频（§8.2）：每个 ogg 都要在 NOTICE 里有同名条目。判据与素材正交 —— 文件在、条目不在就红。
        def sounds = new File(ext.assetsDir, 'sounds')
        def oggs = sounds.isDirectory() ? sounds.listFiles({ File f -> f.name.endsWith('.ogg') } as FileFilter).sort { it.name } : []
        def notice = ext.noticeFile.isFile() ? ext.noticeFile.getText('UTF-8') : ''
        oggs.each { File f ->
            if (!notice.contains(f.name)) { problems << "${rel(f)}：NOTICE 里没有同名条目（音频必须登记出处与许可）" }
        }
        if (problems) {
            throw new GradleException((['场景资源核对失败：'] + problems.collect { '  - ' + it }).join(System.lineSeparator()))
        }
        logger.lifecycle("场景资源核对通过：${modelFiles.size()} 个模型 · ${checkedTextures.size()} 张贴图 · 布局 item ${layoutItems.size()} 个 · 音频 ${oggs.size()} 个")
    }
}

tasks.named('check') {
    dependsOn checkSceneAssets
}

// 结构文件（gzip 的 NBT）读成 Groovy 的 Map / List。救生艇与北辰号两道判据共用这一份（一个实现，ADR-0080 提出来的）。
def readStructureNbt = { File f ->
    def input = new DataInputStream(new BufferedInputStream(new java.util.zip.GZIPInputStream(new FileInputStream(f))))
    def readTag
    readTag = { int type ->
        switch (type) {
            case 1: return input.readByte()
            case 2: return input.readShort()
            case 3: return input.readInt()
            case 4: return input.readLong()
            case 5: return input.readFloat()
            case 6: return input.readDouble()
            case 7: def b = new byte[input.readInt()]; input.readFully(b); return b
            case 8: return input.readUTF()
            case 9: def t = input.readByte() as int; def n = input.readInt(); return (0..<n).collect { readTag(t) }
            case 10:
                def map = [:]
                while (true) {
                    def t = input.readByte() as int
                    if (t == 0) { return map }
                    // ❗名字必须先单独读出来：写成 map[input.readUTF()] = readTag(t) 时 Groovy 先算右边，
                    //   先读了值再读名字，整个流就错位了（实测：读到一半撞上「标签 0」）
                    def key = input.readUTF()
                    map[key] = readTag(t)
                }
            case 11: return (0..<input.readInt()).collect { input.readInt() }
            case 12: return (0..<input.readInt()).collect { input.readLong() }
            default: throw new GradleException("${f.name}：不认识的 NBT 标签 ${type}")
        }
    }
    try {
        if (input.readByte() != 10) { throw new GradleException("${f.name}：根标签不是 Compound") }
        input.readUTF()
        return readTag(10)
    } finally {
        input.close()
    }
}

// 自制装饰方块（救生艇 ADR-0056 · ADR-0057 · 大邮轮 ADR-0062）：每一族四份来源要互相对得上 ——
//   方块登记源码 · 批量生成的方块状态与模型（src/main/generated）·
//   decor_textures.py / liner_decor.py 写进来的模板与贴图（src/main/resources）· 雾海那条艇的结构（boat_hull.nbt，只有救生艇）。
// 哪一份改了、另一份没跟上，游戏里都不报错：只是某几格成了紫黑格子、整块看不见，或取到图集里别的贴图的颜色
// （2026-10-02 灯杆横臂实拍成一条蓝紫色，就是贴图坐标越界）。两族同一段判据（按族给参数），不各抄一份。
def checkDecorBlocks = { Task task, Map fam ->
        def slurper = new groovy.json.JsonSlurper()
        def problems = []
        def rel = { File f -> f.path.replace('\\', '/').replaceFirst('^.*/assets/heavyseas/', '') }

        // 1) Java 里登记了哪些方块（正向对照：一个都没扫到就是判据坏了）。大邮轮的灯与家具（ADR-0063）登记在另一个文件里
        def sources = [task.ext.blocksSource] + (task.ext.has('extraSources') ? task.ext.extraSources : [])
        def registered = (sources.collectMany { File src -> (src.getText('UTF-8') =~ fam.registerPattern).collect { it[1].toString() } }) as Set
        if (registered.isEmpty()) {
            throw new GradleException("没在查：${task.ext.blocksSource.name} 里一个 add(\"${fam.prefix}…\") 都没扫到 —— 判据坏了，不是没有方块")
        }

        // 2) 方块状态文件：与登记的方块一一对应
        def bsDir = new File(task.ext.generatedDir, 'blockstates')
        def bsFiles = (bsDir.listFiles({ File f -> f.name.startsWith(fam.prefix) && f.name.endsWith('.json') } as FileFilter) ?: []) as List
        if (bsFiles.isEmpty()) {
            throw new GradleException("没在查：${bsDir} 下一个 ${fam.prefix}*.json 都没有 —— 判据坏了，或者没跑 ./gradlew :mod:runDatagen")
        }
        def stateFiles = bsFiles.collect { (it.name - '.json').toString() } as Set
        (registered - stateFiles).sort().each { problems << "方块 ${it} 登记了，但没有方块状态文件（改了 ${fam.blocksClass} 之后要重跑 ./gradlew :mod:runDatagen）" }
        (stateFiles - registered).sort().each { problems << "方块状态文件 ${it}.json 没有对应的方块（${fam.blocksClass} 里删了它，生成物没跟上）" }
        def variants = [:]
        def checkedVariants = 0
        def usedModels = [] as Set
        bsFiles.each { File f ->
            def json = slurper.parse(f, 'UTF-8') as Map
            if (json.multipart != null) {
                // 多部件（格架上的常春藤，ADR-0080 §7）：同一组属性（when 里出现的那几个属性）算一层；每一层的项数 = 那几个属性
                //   各自出现过的取值个数之积 —— 与 variants 的「全组合」同一个道理，漏一项游戏里那几格就少一层（不报错）
                def layers = [:].withDefault { [] }
                (json.multipart as List).each { part ->
                    def when = (part.when ?: [:]) as Map
                    layers[when.keySet().collect { it.toString() }.sort().join(',')] << when
                    def applies = part.apply instanceof List ? part.apply : [part.apply]
                    applies.each { usedModels << it.model.toString() }
                }
                layers.each { String props, List whens ->
                    def vals = [:].withDefault { [] as Set }
                    whens.each { Map w -> w.each { k, v -> vals[k.toString()] << v.toString() } }
                    def product = vals.values().inject(1L) { acc, vs -> acc * vs.size() }
                    if (whens.size() != product) {
                        problems << "${rel(f)}：多部件模型按 ${props} 分的那一层 ${whens.size()} 项，不是各属性取值个数之积 ${product}（漏了哪一种组合，那几格就少画一层）"
                    }
                }
                checkedVariants += (json.multipart as List).size()
                return
            }
            variants[(f.name - '.json').toString()] = (json.variants as Map).keySet().collect { it.toString() } as Set
            (json.variants as Map).each { k, v -> usedModels << v.model.toString() }
            // ADR-0062：变体数 = 各属性取值个数之积。判据只取文件自己的键：哪一个属性出现过哪几个值，乘起来就该是变体数
            def values = [:].withDefault { [] as Set }
            (json.variants as Map).keySet().each { String key ->
                if (key) { key.split(',').each { kv -> def p = kv.split('=', 2); values[p[0]] << p[1] } }
            }
            def product = values.values().inject(1L) { acc, vs -> acc * vs.size() }
            def count = (json.variants as Map).size()
            if (count != product) {
                problems << "${rel(f)}：方块状态的变体 ${count} 个，不是各属性取值个数之积 ${product}（漏了哪一种组合，游戏里那一格就是紫黑格子）"
            }
            checkedVariants += count
        }
        // 跨几格的灯与家具（ADR-0063）的物品另有一块「整件缩小」的模板，物品模型直接以它为父 —— 也算用到（模板与贴图照样往下核对）
        def itemModels = new File(task.ext.generatedDir, 'models/item')
        registered.each { name ->
            def f = new File(itemModels, "${name}.json")
            if (f.isFile() && (slurper.parse(f, 'UTF-8') as Map).parent?.toString()?.startsWith("heavyseas:block/${fam.dir}/template/".toString())) {
                usedModels << "heavyseas:item/${name}".toString()
            }
        }

        // 3) 模型 → 模板 → 贴图
        def modelFile = { String id ->
            def path = id.substring(id.indexOf(':') + 1)
            def g = new File(task.ext.generatedDir, "models/${path}.json")
            if (g.isFile()) { return g }
            def r = new File(task.ext.resourcesDir, "models/${path}.json")
            return r.isFile() ? r : null
        }
        def usedTemplates = [] as Set
        def usedTextures = [] as Set
        usedModels.sort().each { String id ->
            def f = modelFile(id)
            if (f == null) { problems << "方块状态引用的模型 ${id} 不存在"; return }
            def m = slurper.parse(f, 'UTF-8') as Map
            def parent = m.parent?.toString()
            if (parent == null || !parent.startsWith("heavyseas:block/${fam.dir}/template/".toString())) {
                problems << "${rel(f)}：父模型 ${parent} 不是${fam.label}模板"
                return
            }
            usedTemplates << parent
            (m.textures ?: [:]).each { k, v -> usedTextures << v.toString() }
        }
        // 游戏按元件位置自动算贴图坐标的规则（没写 uv 的面就用它）；越出 0–16 时游戏不报错，只是取到图集里相邻的别的贴图
        def autoUv = [
                north: { f, t -> [16 - t[0], 16 - t[1], 16 - f[0], 16 - f[1]] },
                south: { f, t -> [f[0], 16 - t[1], t[0], 16 - f[1]] },
                west : { f, t -> [f[2], 16 - t[1], t[2], 16 - f[1]] },
                east : { f, t -> [16 - t[2], 16 - t[1], 16 - f[2], 16 - f[1]] },
                up   : { f, t -> [f[0], f[2], t[0], t[2]] },
                down : { f, t -> [f[0], 16 - t[2], t[0], 16 - f[2]] },
        ]
        def checkedFaces = 0
        usedTemplates.sort().each { String id ->
            def f = modelFile(id)
            if (f == null) { problems << "模板 ${id} 不存在（要 models/${id.substring(id.indexOf(':') + 1)}.json）"; return }
            def m = slurper.parse(f, 'UTF-8') as Map
            (m.elements ?: []).eachWithIndex { el, i ->
                ['from', 'to'].each { key ->
                    (el[key] ?: []).eachWithIndex { v, axis ->
                        if (v < -16 || v > 32) { problems << "${rel(f)}：元素 ${i} 的 ${key}.${'xyz'[axis]} = ${v}，越界 [−16, 32]" }
                    }
                }
                (el.faces ?: [:]).each { dir, face ->
                    def uv = face.uv ?: autoUv[dir.toString()](el.from, el.to)
                    checkedFaces++
                    if (uv.any { it < 0 || it > 16 }) {
                        problems << "${rel(f)}：元素 ${i} 的 ${dir} 面贴图坐标 ${uv} 越出 0–16（游戏里会取到图集里别的贴图）"
                    }
                }
            }
        }
        def pngSize = { File png ->
            def head = new byte[24]
            png.withInputStream { it.read(head) }
            def sig = [0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A]
            if ((0..7).any { (head[it] & 0xFF) != sig[it] }) { return null }
            def be = { int o -> ((head[o] & 0xFF) << 24) | ((head[o + 1] & 0xFF) << 16) | ((head[o + 2] & 0xFF) << 8) | (head[o + 3] & 0xFF) }
            return [be(16), be(20)]
        }
        usedTextures.sort().each { String ref ->
            if (!ref.startsWith("heavyseas:block/${fam.dir}/".toString())) { problems << "贴图 ${ref} 不在 block/${fam.dir}/ 下（一族的模型只引用本族的贴图）"; return }
            def png = new File(task.ext.resourcesDir, "textures/${ref.substring('heavyseas:'.length())}.png")
            if (!png.isFile()) { problems << "贴图 ${ref} 不存在（要 ${rel(png)}）"; return }
            def size = pngSize(png)
            // 灯与家具（ADR-0061 §4 · ADR-0063）一件一张专用大图：prop/ 下的贴图许 16 / 32 / 64 / 128 的正方形；别的照旧 16 宽
            //   （128：魔镜放大到 2 × 3 之后 64 那一张放不下全部的面，2026-10-04 实跑 liner_props 的装箱报错）
            def prop = ref.startsWith("heavyseas:block/${fam.dir}/prop/".toString())
            prop = prop || ref.startsWith("heavyseas:block/${fam.dir}/stairs/".toString())   // 大楼梯一族：栏杆、起步柱同灯与家具，一件一张专用图
            if (size == null) { problems << "${rel(png)}：不是 PNG" }
            else if (prop && !(size[0] in [16, 32, 64, 128] && size[1] == size[0])) { problems << "${rel(png)}：${size[0]}×${size[1]}，灯与家具的贴图应为 16 / 32 / 64 / 128 的正方形" }
            else if (!prop && (size[0] != 16 || size[1] % 16 != 0)) { problems << "${rel(png)}：${size[0]}×${size[1]}，应为 16 宽、高是 16 的倍数" }
        }
        // 没人用的贴图与模板：生成器改了名 / 删了件，旧文件还躺在 jar 里（也说明两边的清单不一致）。
        //   连子目录一起扫（灯与家具在 prop/ 下）；只扫一层时，prop/ 里改名留下的旧文件判据看不见
        def texDir = new File(task.ext.resourcesDir, "textures/block/${fam.dir}")
        // 文件 → 资源 id：按资源根算相对路径（rel() 认的是路径里的 assets/heavyseas/，红测造的副本目录里没有这一段 ——
        //   第一版用了 rel()，副本里每一张都被判成「没人用」，「多一张没人用的」那一例是陪着全体一起红的）
        def idOf = { File f, String top, String ext -> task.ext.resourcesDir.toPath().relativize(f.toPath()).toString()
                .replace(File.separator, '/').replaceFirst("^${top}/", '') - ext }
        def scanned = 0
        // 亮着的玻璃（ADR-0082）：没有模型引用，客户端 GlassGlow 建网格时按屋里的光换上 —— 平常那一张有模型在用、
        //   而且 GlassGlow 源码里写着这一族的换法，才算有人用（只认「…/glass_lit」「…/hull/glass_lit_<n>_<列><行>」（拼大的舷窗）
        //   与「…/window_glass_lit_<压边>」三种名字）
        def glowSource = task.ext.has('glowSource') ? task.ext.glowSource : null
        def glowText = glowSource?.isFile() ? glowSource.getText('UTF-8') : ''
        def unlitOf = { String id ->
            if (id.endsWith('/hull/glass_lit') && glowText.contains('block/liner/hull/glass_lit')) { return id - '_lit' }
            def h = (id =~ /^(.*\/hull\/glass_)lit_([0-9]_[0-9]{2})$/)
            if (h.find() && glowText.contains('"block/liner/hull/glass_"') && glowText.contains('"lit_"')) { return h.group(1) + h.group(2) }
            def m = (id =~ /^(.*\/glass\/window_glass_)lit_([a-z]+)$/)
            if (m.find() && glowText.contains('"lit_"')) { return m.group(1) + m.group(2) }
            return null
        }
        if (texDir.isDirectory()) {
            texDir.eachFileRecurse(groovy.io.FileType.FILES) { File f ->
                if (!f.name.endsWith('.png')) { return }
                scanned++
                def id = idOf(f, 'textures', '.png')
                def unlit = unlitOf(id)
                if (unlit != null && usedTextures.contains("heavyseas:${unlit}".toString())) { return }
                if (!usedTextures.contains("heavyseas:${id}".toString())) { problems << "${rel(f)}：没有任何模型用到" }
            }
        }
        def tplDir = new File(task.ext.resourcesDir, "models/block/${fam.dir}/template")
        if (tplDir.isDirectory()) {
            tplDir.eachFileRecurse(groovy.io.FileType.FILES) { File f ->
                if (!f.name.endsWith('.json')) { return }
                scanned++
                def id = idOf(f, 'models', '.json')
                if (!usedTemplates.contains("heavyseas:${id}".toString())) { problems << "${rel(f)}：没有任何模型用到" }
            }
        }

        def ours = []
        if (fam.hull) {
            // 4) 船体结构：里面每个 heavyseas 方块的状态，都要在它的方块状态文件里有那一项（属性按名字排序拼成键）
            def hull = readStructureNbt(task.ext.hullFile)
            def palette = hull.palette as List
            ours = palette.findAll { it.Name.toString().startsWith('heavyseas:') }
            if (ours.isEmpty()) {
                throw new GradleException("没在查：${task.ext.hullFile.name} 的调色板里一个 heavyseas 方块都没有 —— 船体不是新艇，或判据坏了")
            }
            ours.each { st ->
                def name = st.Name.toString().substring('heavyseas:'.length())
                def props = (st.Properties ?: [:]) as Map
                def key = props.keySet().collect { it.toString() }.sort().collect { "${it}=${props[it]}" }.join(',')
                if (!variants.containsKey(name)) {
                    problems << "${task.ext.hullFile.name}：方块 heavyseas:${name} 没有方块状态文件"
                } else if (!variants[name].contains(key)) {
                    problems << "${task.ext.hullFile.name}：heavyseas:${name}[${key}] 在方块状态文件里没有这一项（结构生成器与 SkiffBlocks 的属性对不上）"
                }
            }
        }

        // 7) 物品（ADR-0058 Q6）：每种方块都有物品模型、两种语言都有名字；创造物品栏只用本模组自己的页签
        def itemDir = new File(task.ext.generatedDir, 'models/item')
        registered.each { name ->
            if (!new File(itemDir, "${name}.json").isFile()) {
                problems << "方块 ${name} 没有物品模型（models/item/${name}.json；重跑 ./gradlew :mod:runDatagen）"
            }
        }
        int named = 0
        ['zh_cn', 'en_us'].each { lang ->
            def langFile = new File(task.ext.resourcesDir, "lang/${lang}.json")
            def table = langFile.isFile() ? (slurper.parse(langFile, 'UTF-8') as Map) : [:]
            if (table.isEmpty()) {
                throw new GradleException("没在查：${rel(langFile)} 读不到或是空的 —— 判据坏了，不是没有名字")
            }
            registered.each { name ->
                if (table["block.heavyseas.${name}".toString()]) {
                    named++
                } else {
                    problems << "${lang} 里没有 block.heavyseas.${name}（物品栏里会露出键名）"
                }
            }
        }
        // 往 Minecraft 自带页签里加东西的写法：ItemGroupEvents.modifyEntriesEvent(ItemGroups.…)。正向对照：源码至少扫到几十个文件。
        def javaFiles = (fam.scanTabs && task.ext.mainSource.isDirectory())
                ? project.fileTree(task.ext.mainSource).matching { include '**/*.java' }.files : [] as Set
        if (fam.scanTabs && javaFiles.size() < 20) {
            throw new GradleException("没在查：${task.ext.mainSource} 下只扫到 ${javaFiles.size()} 个 Java 文件 —— 判据坏了")
        }
        javaFiles.each { File f ->
            f.getText('UTF-8').eachLine { line, i ->
                if (line =~ /ItemGroups\.[A-Z_]+/ && !line.trim().startsWith('//') && !line.trim().startsWith('*')) {
                    // String.eachLine 的行号从 0 数（红测抓到：报成了第 2 行）—— 报给人看的要从 1 数
                    problems << "${f.name}:${i + 1}：往 Minecraft 自带的创造物品栏页签里加了东西 —— 本模组的物品只进自己的那几页（CreativeTabs）"
                }
            }
        }

        if (problems) {
            throw new GradleException((['' + fam.label + '方块核对失败：'] + problems.collect { '  - ' + it }).join(System.lineSeparator()))
        }
        task.logger.lifecycle("${fam.label}方块核对通过：${registered.size()} 种方块 · ${checkedVariants} 个方块状态 · ${usedModels.size()} 个模型 · ${usedTemplates.size()} 块模板" +
                "（${checkedFaces} 个面的贴图坐标）· ${usedTextures.size()} 张贴图" + (fam.hull ? " · 船体里 ${ours.size()} 种状态" : "") +
                " · 物品模型 ${registered.size()} 个 · 名字 ${named} 条 · 扫了 ${scanned} 个贴图与模板文件（含子目录）" +
                (fam.scanTabs ? " · 扫了 ${javaFiles.size()} 个源码文件" : ""))
}

