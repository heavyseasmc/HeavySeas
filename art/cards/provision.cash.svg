      <text class="latin" x="26" y="392.0" font-size="13" font-weight="700" letter-spacing="1" fill="#55483B">&#215; 6</text>
    </g>
    <text class="cjk lod01-hide" x="150" y="368" font-size="30" font-weight="700" letter-spacing="3" text-anchor="middle" fill="#241E1A">大把钞票</text>
