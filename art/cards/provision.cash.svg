      <g transform="translate(2.0 0)"><rect x="86" y="268" width="128" height="22" rx="2" fill="#EDE2C8" stroke="#241E1A" stroke-width="1.7"/><rect x="86" y="282" width="128" height="8" fill="url(#h1)" opacity="0.5"/></g>
      <g transform="translate(-2.6 0)"><rect x="86" y="253" width="128" height="22" rx="2" fill="#EDE2C8" stroke="#241E1A" stroke-width="1.7"/><rect x="86" y="267" width="128" height="8" fill="url(#h1)" opacity="0.5"/></g>
      <g transform="translate(3.2 0)"><rect x="86" y="238" width="128" height="22" rx="2" fill="#EDE2C8" stroke="#241E1A" stroke-width="1.7"/><rect x="86" y="252" width="128" height="8" fill="url(#h1)" opacity="0.5"/></g>
      <g transform="translate(-3.8 0)"><rect x="86" y="223" width="128" height="22" rx="2" fill="#EDE2C8" stroke="#241E1A" stroke-width="1.7"/><rect x="86" y="237" width="128" height="8" fill="url(#h1)" opacity="0.5"/></g>
      <g transform="translate(4.4 0)"><rect x="86" y="208" width="128" height="22" rx="2" fill="#EDE2C8" stroke="#241E1A" stroke-width="1.7"/><rect x="86" y="222" width="128" height="8" fill="url(#h1)" opacity="0.5"/></g>
      <g transform="translate(-5.0 0)"><rect x="86" y="193" width="128" height="22" rx="2" fill="#EDE2C8" stroke="#241E1A" stroke-width="1.7"/><rect x="86" y="207" width="128" height="8" fill="url(#h1)" opacity="0.5"/></g>
      <rect x="84" y="178" width="132" height="24" rx="2" fill="#EDE2C8" stroke="#241E1A" stroke-width="1.9"/>
      <ellipse cx="150" cy="190" rx="18" ry="9" fill="none" stroke="#241E1A" stroke-width="1.0"/>
      <circle cx="150" cy="190" r="4.5" fill="none" stroke="#55483B" stroke-width="1.0"/><text class="latin" x="98" y="194" font-size="10" font-weight="700" fill="#241E1A">100</text><text class="latin" x="202" y="194" font-size="10" font-weight="700" text-anchor="end" fill="#241E1A">100</text>
