      <text class="cjk" x="262.0" y="31.0" font-size="8.5" font-weight="700" text-anchor="middle" fill="#55483B">体力</text>
      <text class="latin" x="262.0" y="57.0" font-size="24" font-weight="700" text-anchor="middle" fill="#241E1A">3</text>
    </g>
    <g id="art" clip-path="url(#clipArt)" transform="translate(150 197.00) scale(0.7689) translate(-150 -195.00)">
      <path d="M150 92 L168 128 L168 226 L132 226 L132 128 Z" fill="#EDE2C8"/>
      <rect clip-path="url(#cBlade)" x="150" y="88" width="22" height="150" fill="url(#h1)" opacity="0.7"/><rect clip-path="url(#cBlade)" x="160" y="88" width="12" height="150" fill="url(#h2)" opacity="0.7"/>
      <path d="M150 92 L168 128 L168 226 L132 226 L132 128 Z" fill="none" stroke="#241E1A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><path d="M150 100 L150 222" fill="none" stroke="#55483B" stroke-width="1.1" opacity="0.6"/>
      <path d="M134 130 L134 222" stroke="#EDE2C8" stroke-width="2" opacity="0.9" fill="none"/>
      <rect x="118" y="226" width="64" height="12" rx="3" fill="#8C7C67" stroke="#241E1A" stroke-width="2.0"/>
      <path d="M136 238 L164 238 L160 300 C159 306,141 306,140 300 Z" fill="none" stroke="#241E1A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M136 238 L164 238 L160 300 C159 306,141 306,140 300 Z" fill="#EDE2C8"/>
      <path d="M136 238 L164 238 L160 300 C159 306,141 306,140 300 Z" fill="none" stroke="#241E1A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M138 252 L162 252" fill="none" stroke="#55483B" stroke-width="1.1" opacity="0.65"/>
      <path d="M138 266 L162 266" fill="none" stroke="#55483B" stroke-width="1.1" opacity="0.65"/>
      <path d="M138 280 L162 280" fill="none" stroke="#55483B" stroke-width="1.1" opacity="0.65"/>
    </g>
    <g id="footer" class="lod2-hide">
      <g transform="rotate(-6 253.0 384.0)" opacity="0.6">
        <rect x="234.0" y="378.0" width="38" height="12" rx="1.5" fill="none" stroke="#A8402C" stroke-width="1.6"/>
        <text class="latin" x="253.0" y="386.6" font-size="7.6" fill="#A8402C" text-anchor="middle" letter-spacing="1.2">RATION</text>
      </g>
      <text class="latin" x="26" y="392.0" font-size="13" font-weight="700" letter-spacing="1" fill="#55483B">&#215; 1</text>
    </g>
    <text class="cjk lod01-hide" x="150" y="368" font-size="56" font-weight="700" letter-spacing="3" text-anchor="middle" fill="#241E1A">短刀</text>
  </g>
</svg>
