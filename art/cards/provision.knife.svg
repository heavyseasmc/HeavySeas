<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 420" width="300" height="420">
  <title>怒海狂涛 · 物资卡 · 短刀</title>
  <defs>
    <style type="text/css">
      /* 字体热替换入口：覆盖 --cjk 即可，见 art/fonts.json */
      svg {
        --cjk:   'KingHwa_OldSong','Huiwen-MinchoGBK','Noto Serif SC',serif;
        --latin: 'Old Standard TT','EB Garamond',serif;
      }
      .cjk   { font-family: var(--cjk); }
      .latin { font-family: var(--latin); }
      /* LOD2 专用的大号牌名：母版里默认隐藏。
         这条必须写在 SVG 自己身上 —— 只靠渲染脚本的 CSS 盖住，
         等于校对看到的和别人打开 SVG 看到的不是同一张图。 */
      .lod01-hide { display: none; }
    </style>
    <pattern id="h1" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="3.4" stroke="#241E1A" stroke-width="1" opacity="0.62"/>
    </pattern>
    <pattern id="h2" width="2.2" height="2.2" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="2.2" stroke="#241E1A" stroke-width="0.95" opacity="0.78"/>
    </pattern>
    <pattern id="hx" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="2.6" stroke="#241E1A" stroke-width="0.9" opacity="0.8"/>
      <line x1="0" y1="0" x2="2.6" y2="0" stroke="#241E1A" stroke-width="0.9" opacity="0.8"/>
    </pattern>
    <radialGradient id="vig" cx="50%" cy="42%" r="62%">
      <stop offset="60%" stop-color="#241E1A" stop-opacity="0"/>
      <stop offset="100%" stop-color="#241E1A" stop-opacity="0.16"/>
    </radialGradient>
    <clipPath id="clipArt"><rect x="16" y="76.0" width="268" height="246.0"/></clipPath>
    <clipPath id="clipCard"><rect width="300" height="420" rx="5"/></clipPath>
    <clipPath id="clipCardW"><rect width="420" height="300" rx="5"/></clipPath>
    <clipPath id="cBlade"><path d="M150 92 L168 128 L168 226 L132 226 L132 128 Z"/></clipPath>
  </defs>
  <g clip-path="url(#clipCard)">
    <g id="paper">
      <rect width="300" height="420" fill="#E4D7B8"/>
      <path d="M0 0 L58 0 C36 16 16 36 0 58 Z" fill="#CBB995" opacity="0.26"/>
      <path d="M300 420 L242 420 C264 404 284 384 300 362 Z" fill="#CBB995" opacity="0.22"/>
      <g class="lod2-hide" fill="#CBB995" stroke="none">
        <path opacity="0.16" d="M254 346 c9 -7,21 -4,24 4 c3 8,-3 15,-12 16 c-10 1,-17 -4,-17 -11 c0 -4,2 -7,5 -9 Z"/>
        <path opacity="0.13" d="M22 176 c6 -5,14 -2,15 5 c1 6,-4 10,-10 9 c-6 -1,-9 -7,-5 -14 Z"/>
      </g>
      <rect width="300" height="420" fill="url(#vig)"/>
    </g>
    <g id="frame" fill="none" stroke="#241E1A">
      <rect x="9.5" y="9.5" width="281" height="401" stroke-width="3.0"/>
      <rect class="lod2-hide" x="15.5" y="15.5" width="269" height="389" stroke-width="1.0" opacity="0.75"/>
      <g class="lod2-hide" stroke-width="1.2" opacity="0.6">
        <path d="M15.5 23.5 L15.5 15.5 L23.5 15.5"/>
        <path d="M276.5 15.5 L284.5 15.5 L284.5 23.5"/>
        <path d="M284.5 396.5 L284.5 404.5 L276.5 404.5"/>
        <path d="M23.5 404.5 L15.5 404.5 L15.5 396.5"/>
