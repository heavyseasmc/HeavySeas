    <clipPath id="clipCard"><rect width="300" height="420" rx="5"/></clipPath>
    <clipPath id="clipCardW"><rect width="420" height="300" rx="5"/></clipPath>
    <clipPath id="cOarBl"><path d="M143 230.0 C136 237.0,126 243.0,124 252.0 L124 294.0 C124 302.0,132 306.0,150 306.0 C168 306.0,176 302.0,176 294.0 L176 252.0 C174 243.0,164 237.0,157 230.0 Z"/></clipPath>
  </defs>
