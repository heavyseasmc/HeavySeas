      <rect class="lod2-hide" x="15.5" y="15.5" width="269" height="389" stroke-width="1.0" opacity="0.75"/>
      <g class="lod2-hide" stroke-width="1.2" opacity="0.6">
        <path d="M15.5 23.5 L15.5 15.5 L23.5 15.5"/>
        <path d="M276.5 15.5 L284.5 15.5 L284.5 23.5"/>
        <path d="M284.5 396.5 L284.5 404.5 L276.5 404.5"/>
        <path d="M23.5 404.5 L15.5 404.5 L15.5 396.5"/>
