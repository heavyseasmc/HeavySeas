      <path d="M126 138 L126 118 C126 112,174 112,174 118 L174 138 C174 156,192 168,192 196 L192 286 C192 296,184 300,172 300 L128 300 C116 300,108 296,108 286 L108 196 C108 168,126 156,126 138 Z" fill="#EDE2C8"/>
      <rect clip-path="url(#cBot)" x="156" y="110" width="44" height="200" fill="url(#h1)" opacity="1.0"/><rect clip-path="url(#cBot)" x="172" y="110" width="28" height="200" fill="url(#h2)" opacity="1.0"/><rect clip-path="url(#cBot)" x="182" y="110" width="18" height="200" fill="url(#hx)" opacity="0.85"/>
      <path clip-path="url(#cBot)" d="M104 212 L196 212 L196 304 L104 304 Z" fill="#8A5A3C" opacity="0.30"/><path d="M104 212 L196 212" fill="none" stroke="#241E1A" stroke-width="1.4" opacity="0.8"/>
      <path d="M126 138 L126 118 C126 112,174 112,174 118 L174 138 C174 156,192 168,192 196 L192 286 C192 296,184 300,172 300 L128 300 C116 300,108 296,108 286 L108 196 C108 168,126 156,126 138 Z" fill="none" stroke="#241E1A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="122" y="108" width="56" height="12" rx="3" fill="#A8402C" opacity="0.8" stroke="#241E1A" stroke-width="1.6"/>
      <rect x="118" y="222" width="64" height="46" rx="2" fill="#EDE2C8" stroke="#241E1A" stroke-width="1.5"/>
      <path d="M124 234 L176 234" fill="none" stroke="#55483B" stroke-width="0.9" opacity="0.7"/><path d="M124 252 L176 252" fill="none" stroke="#55483B" stroke-width="0.8" opacity="0.55"/><path d="M132 259 L168 259" fill="none" stroke="#55483B" stroke-width="0.8" opacity="0.45"/>
      <text class="latin" x="150" y="246" font-size="11" font-weight="700" text-anchor="middle" fill="#241E1A">RUM</text>
      <path d="M206 258 L210 292 C210.5 295,224 295,224.5 292 L228 258 Z" fill="#EDE2C8"/>
      <path d="M206 258 L210 292 C210.5 295,224 295,224.5 292 L228 258 Z" fill="none" stroke="#241E1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="217" cy="258" rx="11" ry="4" fill="#EDE2C8" stroke="#241E1A" stroke-width="1.6"/>
    </g>
    <g id="rule-panel" class="lod1-hide lod2-hide">
      <rect x="24" y="324.0" width="252" height="30.0" rx="2" fill="#CBB995" opacity="0.55"/>
      <rect x="24" y="324.0" width="252" height="30.0" rx="2" fill="none" stroke="#241E1A" stroke-width="1.0" opacity="0.6"/>
      <text class="cjk" x="150" y="344.0" font-size="10" font-weight="500" text-anchor="middle" fill="#241E1A">本回合体力+3，回合结束时口渴</text>
    </g>
    <g id="footer" class="lod2-hide">
      <g transform="rotate(-6 253.0 384.0)" opacity="0.6">
        <rect x="234.0" y="378.0" width="38" height="12" rx="1.5" fill="none" stroke="#A8402C" stroke-width="1.6"/>
        <text class="latin" x="253.0" y="386.6" font-size="7.6" fill="#A8402C" text-anchor="middle" letter-spacing="1.2">RATION</text>
      </g>
      <text class="latin" x="26" y="392.0" font-size="13" font-weight="700" letter-spacing="1" fill="#55483B">&#215; 3</text>
    </g>
    <text class="cjk lod01-hide" x="150" y="368" font-size="40" font-weight="700" letter-spacing="3" text-anchor="middle" fill="#241E1A">朗姆酒</text>
