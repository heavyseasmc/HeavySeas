      <text class="cjk lod2-hide" x="38" y="33.0" font-size="10" font-weight="700" letter-spacing="2.4" fill="#55483B">消耗品</text>
      <text class="latin lod2-hide" x="102" y="33.0" font-size="9.5" font-weight="700" letter-spacing="1.2" fill="#55483B" opacity="0.8">No. 02</text>
      <text class="cjk lod2-hide" x="28" y="58.0" font-size="24" font-weight="700" letter-spacing="2" fill="#241E1A">医疗箱</text>
      <line class="lod2-hide" x1="24" y1="70.0" x2="276" y2="70.0" stroke="#241E1A" stroke-width="1.4" opacity="0.9"/>
      <line class="lod2-hide" x1="24" y1="73.0" x2="276" y2="73.0" stroke="#241E1A" stroke-width="0.6" opacity="0.6"/>
    </g>
    <g id="art" clip-path="url(#clipArt)" transform="translate(150 197.00) scale(0.8238) translate(-150 -195.00)">
      <g id="ground"><ellipse cx="158" cy="306" rx="67" ry="9" fill="#241E1A" opacity="0.22"/><line x1="72" y1="308" x2="228" y2="308" stroke="#8C7C67" stroke-width="1.00" opacity="0.75"/><line x1="82" y1="313" x2="218" y2="313" stroke="#8C7C67" stroke-width="0.87" opacity="0.6"/><line x1="98" y1="318" x2="202" y2="318" stroke="#8C7C67" stroke-width="0.74" opacity="0.5"/><line x1="116" y1="322" x2="184" y2="322" stroke="#8C7C67" stroke-width="0.61" opacity="0.4"/></g>
      <path d="M88 168 C88 152,110 142,150 142 C190 142,212 152,212 168 L218 286 C218 296,208 300,196 300 L104 300 C92 300,82 296,82 286 Z" fill="#EDE2C8"/>
      <rect clip-path="url(#cBag)" x="160" y="140" width="70" height="170" fill="url(#h1)" opacity="1.0"/><rect clip-path="url(#cBag)" x="186" y="140" width="44" height="170" fill="url(#h2)" opacity="1.0"/><rect clip-path="url(#cBag)" x="204" y="140" width="26" height="170" fill="url(#hx)" opacity="0.8"/><rect clip-path="url(#cBag)" x="78" y="276" width="150" height="30" fill="url(#h1)" opacity="0.75"/>
      <path d="M88 168 C88 152,110 142,150 142 C190 142,212 152,212 168 L218 286 C218 296,208 300,196 300 L104 300 C92 300,82 296,82 286 Z" fill="none" stroke="#241E1A" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M120 146 C122 116,178 116,180 146" fill="none" stroke="#241E1A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M126 147 C128 122,172 122,174 147" fill="none" stroke="#55483B" stroke-width="1.1" opacity="0.7"/>
      <path d="M82 172 C110 162,190 162,218 172" fill="none" stroke="#241E1A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M82 178 C110 168,190 168,218 178" fill="none" stroke="#55483B" stroke-width="1.0" opacity="0.7"/>
      <rect x="142" y="166" width="16" height="22" rx="2" fill="#A8854A" stroke="#241E1A" stroke-width="1.5"/>
      <path d="M136 214 h28 v22 h22 v28 h-22 v22 h-28 v-22 h-22 v-28 h22 Z" fill="#A8402C" opacity="0.82"/>
      <path d="M136 214 h28 v22 h22 v28 h-22 v22 h-28 v-22 h-22 v-28 h22 Z" fill="none" stroke="#241E1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="rule-panel" class="lod1-hide lod2-hide">
      <rect x="24" y="324.0" width="252" height="30.0" rx="2" fill="#CBB995" opacity="0.55"/>
      <rect x="24" y="324.0" width="252" height="30.0" rx="2" fill="none" stroke="#241E1A" stroke-width="1.0" opacity="0.6"/>
      <text class="cjk" x="150" y="344.0" font-size="10" font-weight="500" text-anchor="middle" fill="#241E1A">特殊行动：移除任一角色1点伤害</text>
    </g>
    <g id="footer" class="lod2-hide">
      <g transform="rotate(-6 253.0 384.0)" opacity="0.6">
        <rect x="234.0" y="378.0" width="38" height="12" rx="1.5" fill="none" stroke="#A8402C" stroke-width="1.6"/>
        <text class="latin" x="253.0" y="386.6" font-size="7.6" fill="#A8402C" text-anchor="middle" letter-spacing="1.2">RATION</text>
      </g>
      <text class="latin" x="26" y="392.0" font-size="13" font-weight="700" letter-spacing="1" fill="#55483B">&#215; 4</text>
    </g>
    <text class="cjk lod01-hide" x="150" y="368" font-size="40" font-weight="700" letter-spacing="3" text-anchor="middle" fill="#241E1A">医疗箱</text>
  </g>
</svg>
