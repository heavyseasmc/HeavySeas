      svg {
        --cjk:   'KingHwa_OldSong','Huiwen-MinchoGBK','Noto Serif SC',serif;
        --latin: 'Old Standard TT','EB Garamond',serif;
      }
      .cjk   { font-family: var(--cjk); }
      .latin { font-family: var(--latin); }
      /* LOD2 专用的大号牌名：母版里默认隐藏。
         这条必须写在 SVG 自己身上 —— 只靠渲染脚本的 CSS 盖住，
         等于校对看到的和别人打开 SVG 看到的不是同一张图。 */
      .lod01-hide { display: none; }
    </style>
    <pattern id="h1" width="3.4" height="3.4" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="3.4" stroke="#241E1A" stroke-width="1" opacity="0.62"/>
    </pattern>
    <pattern id="h2" width="2.2" height="2.2" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <line x1="0" y1="0" x2="0" y2="2.2" stroke="#241E1A" stroke-width="0.95" opacity="0.78"/>
    </pattern>
    <pattern id="hx" width="2.6" height="2.6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
